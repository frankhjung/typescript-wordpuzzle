---
name: build

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify code formatting
        run: npx prettier --check .

      - name: Static lint analysis
        run: npx eslint .

      - name: Static type check
        run: npx tsc --noEmit

      - name: Execute unit and property tests
        run: npx vitest run --coverage

      - name: Smoke test CLI invocation - help
        run: npx tsx src/cli.ts --help

      - name: Smoke test CLI invocation - example
        run: npx tsx src/cli.ts -s 7 -l cadevrsoi

      - name: Compile production distribution
        run: npx tsc -p tsconfig.build.json

      - name: Upload production distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
