---
name: Deploy Solver to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify code formatting
        run: npx prettier --check .

      - name: Static lint analysis
        run: npx eslint .

      - name: Static type check
        run: npx tsc --noEmit

      - name: Execute unit and property tests
        run: npx vitest run --coverage

      - name: Smoke test CLI invocation - help
        run: npx tsx src/cli.ts --help

      - name: Smoke test CLI invocation - example
        run: npx tsx src/cli.ts -s 7 -l cadevrsoi

      - name: Compile production distribution
        run: npm run build

      - name: Upload production distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

      - name: Setup Pages
        if: >-
          github.ref == 'refs/heads/main' &&
          github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: >-
          github.ref == 'refs/heads/main' &&
          github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
